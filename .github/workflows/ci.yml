name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 e o piso: tomllib entrou nela.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        # Sem pytest de proposito: o modulo testado nao tem dependencia, e o CI
        # nao deveria precisar de mais que o interpretador para prova-lo.
        # A descoberta dos modulos mora em tests/run.py, e nao aqui: com a lista
        # colada no YAML, um arquivo de teste novo nao rodava ate alguem lembrar
        # de editar o workflow.
        run: python tests/run.py

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sintaxe de todos os modulos
        run: python -c "import ast,pathlib;[ast.parse(p.read_text()) for p in pathlib.Path('clamav_tray').glob('*.py')]"
      - name: Nomes indefinidos
        # O tray nao tem teste de interface: um NameError dentro de um metodo do
        # menu so aparece quando o metodo roda — na 0.3, foi o servico de usuario
        # reiniciando em laco. O pyflakes acha isso sem executar. So nome
        # indefinido reprova; import sem uso e estilo, nao quebra ninguem.
        run: |
          pip install -q pyflakes
          if python -m pyflakes clamav_tray tests | grep -E "undefined name|referenced before assignment"; then exit 1; fi
      - name: Docs EN e PT-BR em sincronia
        # Cada X.md tem um X.pt-BR.md ao lado (exceto o CHANGELOG, so em ingles).
        # Mesmo numero de titulos e de blocos de codigo nos dois: pega "mudou um
        # idioma e esqueceu o outro". Nao confere a traducao em si.
        run: python scripts/check-docs-i18n.py
      - name: Sintaxe dos scripts de shell
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
      - name: Unidades do systemd sao validas
        run: |
          for f in $(git ls-files '*.service' '*.timer'); do
            grep -qE '^\[(Unit|Service|Timer|Install)\]' "$f" || { echo "sem secao: $f"; exit 1; }
          done
