name: Publicar no PyPI

# Dispara so com tag de versao (v0.1.0, v0.2.0...). Push comum nao publica nada.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testes
        run: python tests/run.py
      - name: Tag, pyproject e __init__ dizem a mesma versao
        # A versao mora em dois lugares. Publicar v0.2.0 com pyproject em 0.1.0
        # sobe um 0.1.0 duplicado (o PyPI recusa) ou, pior, um numero que nao bate
        # com o que `clamav-tray` reporta. Melhor falhar aqui.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYP=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' clamav_tray/__init__.py)
          echo "tag=$TAG pyproject=$PYP __init__=$INIT"
          [ "$TAG" = "$PYP" ] && [ "$TAG" = "$INIT" ]
      - name: Build
        run: python -m pip install -q build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    # O ambiente "pypi" precisa existir no repositorio e estar cadastrado como
    # publicador confiavel no PyPI. Sem token guardado: o PyPI confia no OIDC
    # deste workflow, e so deste.
    environment: { name: pypi, url: https://pypi.org/p/clamav-tray }
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
